# =============================================================================
# NGINX CONFIGURATION FOR FRONTEND
# =============================================================================
# Optimized for Vue.js SPA with SignalR proxy support and extended timeouts

user appuser;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Extended timeouts for OCR processing
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Minimal security headers for Google OAuth compatibility
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header X-Frame-Options "SAMEORIGIN";

    # Completely disable CSP and COOP/COEP for Google OAuth
    # These headers interfere with Google's OAuth popup mechanism
    # add_header Content-Security-Policy "..."; # Disabled for Google OAuth
    # add_header Cross-Origin-Opener-Policy "..."; # Disabled for Google OAuth
    # add_header Cross-Origin-Embedder-Policy "..."; # Disabled for Google OAuth

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Extended client timeouts for large file uploads
        client_max_body_size 100M;
        client_body_timeout 300s;
        client_header_timeout 300s;

        # Serve index.html with AGGRESSIVE NO-CACHE for development
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0, s-maxage=0";
            add_header Pragma "no-cache";
            add_header Last-Modified "";
            add_header ETag "";
            if_modified_since off;
            add_header Expires "Thu, 01 Jan 1970 00:00:01 GMT";

            # Force revalidation
            add_header X-Accel-Expires "0";
            add_header Vary "*";
        }

        # Serve static files - NO CACHING FOR DEVELOPMENT
        location / {
            try_files $uri $uri/ /index.html;

            # DISABLE ALL CACHING FOR DEVELOPMENT
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Last-Modified "";
            add_header ETag "";

            # Ensure no browser caching
            if_modified_since off;
            add_header Expires "Thu, 01 Jan 1970 00:00:01 GMT";
        }

        # API proxy to backend with extended timeouts
        location /api/ {
            proxy_pass http://backend:5000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Extended timeouts for OCR processing
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # SignalR hub proxy with WebSocket support
        location /notificationHub {
            proxy_pass http://backend:5000/notificationHub;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Extended timeouts for SignalR
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Handle static assets - NO CACHING FOR DEVELOPMENT
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            # DISABLE ALL CACHING FOR DEVELOPMENT
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Last-Modified "";
            add_header ETag "";
            if_modified_since off;
            add_header Expires "Thu, 01 Jan 1970 00:00:01 GMT";

            # CORS headers
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
        }

        # Error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
